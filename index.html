<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#b40012">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<title>செந்தூர் முருகன் ஃபைனான்ஸ்</title>
<style>
:root{--red:#b40012;--red2:#e11b2e;--yellow:#ffd21c;--gold:#f5b900;--dark:#240006;--bg:#fff8df;--card:#fffdf5;--muted:#777;--green:#16833b}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:'Noto Sans Tamil',system-ui,Arial,sans-serif;background:var(--bg);color:#24110e;overscroll-behavior-x:none}
body{touch-action:pan-y}.hidden{display:none!important}.app{min-height:100dvh}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--red),#79000d);color:#fff;padding:12px 14px;box-shadow:0 3px 12px #0003;display:flex;align-items:center;gap:10px}
.topbar .brand{font-weight:800;line-height:1.05;flex:1}.brand small{font-size:11px;opacity:.9}.iconbtn{width:42px;height:42px;border:0;border-radius:12px;background:#ffffff18;color:#fff;font-size:22px}
.container{max-width:1180px;margin:auto;padding:14px}.screen{max-width:1180px;margin:auto}
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 15%,#ffe56a 0,#fff2b0 20%,#fff8df 48%,#f5d56a 100%)}
.login-card{width:min(430px,100%);background:#fff;border:4px solid var(--gold);border-radius:28px;padding:20px;box-shadow:0 18px 50px #6c1b0060;text-align:center}
.login-card img{width:220px;height:220px;object-fit:contain;border-radius:25px;animation:zoomLogo 3s ease-in-out infinite alternate}
@keyframes zoomLogo{from{transform:scale(.82)}to{transform:scale(1)}}
.login-card h1{margin:8px 0 0;color:var(--red);font-size:25px}.login-card p{margin:3px 0 18px;color:#6b3d22}
.form-group{margin:10px 0;text-align:left}.form-group label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid #d7b75d;border-radius:12px;padding:11px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #b4001218}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800}.btn-primary{background:linear-gradient(135deg,var(--red),#7e000c);color:#fff}.btn-yellow{background:var(--yellow);color:#4b1600}.btn-outline{background:#fff;border:1px solid var(--red);color:var(--red)}.btn-danger{background:#8e0010;color:#fff}.btn-green{background:var(--green);color:#fff}
.login .btn{width:100%;margin-top:12px;font-size:16px}.hint{font-size:12px;color:#777;margin-top:12px}
.warn{background:#fff0f0;color:#9c0010;border:1px solid #ef9ca5;padding:10px;border-radius:12px;margin:10px 0;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(100px);background:#24110e;color:#fff;padding:12px 18px;border-radius:999px;z-index:200;transition:.25s;max-width:90%;text-align:center}.toast.show{transform:translateX(-50%) translateY(0)}
.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--card);border:1px solid #e3c75e;border-left:5px solid var(--red);border-radius:16px;padding:15px;min-height:105px;box-shadow:0 3px 10px #6b250012}.stat .n{font-size:23px;font-weight:900;color:var(--red);margin-top:7px}.stat .l{font-size:13px;font-weight:800}.stat.click{cursor:pointer}.section{background:#fff;border-radius:18px;border:1px solid #ead47a;padding:15px;margin-bottom:14px;box-shadow:0 3px 12px #5b26000c}.section h2,.section h3{margin:0 0 12px;color:var(--red)}
.quick{grid-template-columns:repeat(3,1fr)}.quick button{min-height:80px}
.menu{position:fixed;inset:0;z-index:100;background:#0006;display:none}.menu.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(360px,92%);background:#fff8df;padding:18px;overflow:auto;box-shadow:-10px 0 35px #0004}.drawer h2{color:var(--red)}.menuitem{display:flex;width:100%;padding:13px;border:0;border-bottom:1px solid #ead47a;background:transparent;text-align:left;font-weight:800;color:#35120e}.menuitem.danger{color:#a00010}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar>*{flex:0 0 auto}.tablewrap{overflow:auto;border:1px solid #ead47a;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:700px;background:#fff}th,td{padding:10px;border-bottom:1px solid #eee1ac;text-align:left;font-size:13px}th{background:#fff0a8;color:#641000;position:sticky;top:0}.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;display:inline-block}.badge.green{background:#d9f4df;color:#176c2d}.badge.red{background:#ffe0e0;color:#97000e}.badge.yellow{background:#fff0a8;color:#6a4b00}.modal{position:fixed;inset:0;background:#0008;z-index:120;display:none;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.modalbox{background:#fffdf5;border:2px solid var(--gold);border-radius:20px;width:min(760px,100%);max-height:92dvh;overflow:auto;padding:18px}.modalbox h2{color:var(--red);margin-top:0}.close{float:right;border:0;background:#fee;color:var(--red);border-radius:10px;padding:8px 11px;font-weight:900}
.photo{width:100px;height:100px;object-fit:cover;border-radius:14px;border:2px solid var(--gold)}.thumbs{display:flex;gap:8px;flex-wrap:wrap}.filebox{border:2px dashed #d9bd57;border-radius:12px;padding:10px;background:#fffaf0}
.footer{text-align:center;color:#856d62;font-size:12px;padding:25px 10px}
@media(max-width:700px){.stats,.quick,.three,.two{grid-template-columns:1fr 1fr}.stat{min-height:92px;padding:11px}.stat .n{font-size:19px}.container{padding:10px}.topbar{padding:9px 10px}.login-card{padding:16px}.login-card img{width:185px;height:185px}}
@media(max-width:430px){.stats,.quick,.three,.two{grid-template-columns:1fr}.stat{min-height:auto}.toolbar .btn{width:100%}}

/* ---------- A4 Portrait Loan Sanction V2 ---------- */
.sanction-preview-wrap{overflow:auto;background:#eee;padding:12px;border-radius:14px}
.sanction-a4-preview{width:210mm;min-height:297mm;margin:0 auto 14px;background:#fff;color:#222;
  padding:14mm 15mm;box-sizing:border-box;box-shadow:0 5px 25px #0002;border:1px solid #ddd;
  font-family:'Noto Sans Tamil',Arial,sans-serif;position:relative}
.sanction-a4-preview:last-child{margin-bottom:0}
.sanction-a4-preview .san-head{height:36mm;position:relative;border-bottom:1px solid #b40012}
.sanction-a4-preview .san-logo{position:absolute;left:0;top:0;width:27mm;height:27mm;object-fit:contain}
.sanction-a4-preview .san-headtext{margin-left:32mm;margin-right:40mm;text-align:center;padding-top:1mm}
.sanction-a4-preview .san-title{font-size:19px;font-weight:900;color:#b40012}
.sanction-a4-preview .san-sub{font-size:11px;font-weight:800;margin-top:1mm}
.sanction-a4-preview .san-small{font-size:8px;margin-top:1mm}
.sanction-a4-preview .san-ref{display:flex;justify-content:space-between;font-size:9px;margin-top:5mm}
.sanction-a4-preview .san-letter-title{text-align:center;margin:5mm 0 4mm;color:#b40012}
.sanction-a4-preview .san-letter-title b{font-size:16px}.sanction-a4-preview .san-letter-title div{font-size:10px;font-weight:800}
.sanction-a4-preview .san-box{border:1px solid #bbb;padding:3mm;margin-top:3mm}
.sanction-a4-preview .san-row{display:flex;min-height:10mm;border-bottom:.3mm solid #ddd}
.sanction-a4-preview .san-row:last-child{border-bottom:0}
.sanction-a4-preview .san-label{width:72mm;padding:2mm;font-size:9px;font-weight:800}
.sanction-a4-preview .san-value{flex:1;padding:2mm;font-size:9px}
.sanction-a4-preview .san-terms{font-size:8.5px;line-height:1.55;margin-top:4mm}
.sanction-a4-preview .san-signs{display:flex;justify-content:space-between;margin-top:15mm;font-size:8.5px;text-align:center}
.sanction-a4-preview .san-sign{width:62mm}
.sanction-party-photo{position:absolute;right:0;top:0;width:35mm;height:45mm;object-fit:cover;border:1px solid #555;border-radius:1mm;background:#f8f8f8}
.sanction-party-photo-placeholder{position:absolute;right:0;top:0;width:35mm;height:45mm;border:1px dashed #777;display:flex;align-items:center;justify-content:center;font-size:7px;color:#777;text-align:center;background:#fafafa}
.san-doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-top:5mm}
.san-doc{border:1px solid #bbb;padding:3mm;text-align:center;min-height:58mm}
.san-doc img{display:block;margin:2mm auto 0;width:78mm;height:45mm;object-fit:contain;border:1px solid #777;background:#fff}
.san-party-id{margin-top:4mm;font-size:8.5px;line-height:1.65}
.san-nominee{display:flex;gap:8mm;margin-top:6mm;align-items:flex-start}
.san-nominee-photo{width:35mm;height:45mm;object-fit:cover;border:1px solid #555;background:#fafafa}
.san-nominee-placeholder{width:35mm;height:45mm;border:1px dashed #777;display:flex;align-items:center;justify-content:center;font-size:7px;color:#777;text-align:center}
.san-nominee-info{flex:1;font-size:9px;line-height:1.8}
.san-page-label{text-align:right;font-size:7px;color:#777;margin-bottom:2mm}
@media(max-width:700px){
  .sanction-preview-wrap{padding:6px}
  .sanction-a4-preview{transform-origin:top left;width:210mm;min-height:297mm}
  .sanction-a4-preview .san-label{width:45%}
  .sanction-a4-preview .san-headtext{margin-left:28mm;margin-right:38mm}
}
@media print{
  body>*{display:none!important}
  #printSanctionRoot{display:block!important;position:static!important}
  #printSanctionRoot .sanction-a4-preview{display:block!important;width:210mm!important;height:297mm!important;
    min-height:297mm!important;margin:0!important;padding:14mm 15mm!important;box-shadow:none!important;border:0!important}
  @page{size:A4 portrait;margin:0}
}

  const admin=db.users.find(u=>String(u.username||"").trim().toLowerCase()==="admin");
  if(!admin){
    db.users.unshift({id:"u_admin",name:"Admin",username:"admin",password:"0000",category:"Admin"});
  }else{
    admin.username="admin";
    if(!admin.password) admin.password="0000";
    admin.category="Admin";
  }

  if(!db.settings) db.settings=blankDB().settings;
  if(!Array.isArray(db.parties)) db.parties=[];
  if(!Array.isArray(db.loans)) db.loans=[];
  if(!Array.isArray(db.payments)) db.payments=[];
  return db;
}

function addPeriod(d,n,type){const x=new Date(d); if(type==="weekly")x.setDate(x.getDate()+n*7);else x.setMonth(x.getMonth()+n);return x.toISOString().slice(0,10)}

function paidForLoan(id){return state.data.payments.filter(p=>p.loanId===id).reduce((a,p)=>a+Number(p.amount||0),0)}
function loanBalance(l){return Math.max(0,Number(l.totalPayable||l.amount||0)-paidForLoan(l.id))}
function loanStatus(l){const b=loanBalance(l); if(b<=0)return"Closed"; const last=new Date(l.lastDueDate||l.startDate); if(last<new Date() && b>0)return"Over Due"; return"Pending"}
function partyLoans(pid){return state.data.loans.filter(l=>l.partyId===pid)}
function partyPaid(pid){return state.data.loans.filter(l=>l.partyId===pid).reduce((a,l)=>a+paidForLoan(l.id),0)}

/* ---------- login / back-swipe protection ---------- */
async function login(){
  const u=document.getElementById("username").value.trim();
  const p=document.getElementById("password").value;
  const warn=document.getElementById("loginWarn");
  warn.classList.add("hidden"); warn.textContent="";
  if(!u || !p){
    warn.textContent="⚠️ Username மற்றும் Password இரண்டையும் உள்ளிடவும்.";
    warn.classList.remove("hidden"); return;
  }

  // 1) Local account login first for username/password accounts.
  // This keeps the default admin (admin / 0000) working even when Supabase is configured.
  let found=Array.isArray(state.data?.users) ? state.data.users.find(x=>
    String(x.username||"").trim().toLowerCase()===u.toLowerCase() &&
    String(x.password??"")===p
  ) : null;

  if(!found && u.toLowerCase()==="admin" && p==="0000"){
    found={id:"u_admin",name:"Admin",username:"admin",password:"0000",category:"Admin"};
    state.data.users=Array.isArray(state.data.users)?state.data.users:[];
    state.data.users=state.data.users.filter(x=>String(x.username||"").trim().toLowerCase()!=="admin");
    state.data.users.unshift(found); saveLocal();
  }

  if(found){
    state.user={...found};
    sessionStorage.setItem("smf_session",JSON.stringify(state.user));
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    history.replaceState({smf:true,view:"dashboard"},"","#app-dashboard");
    state.view="dashboard";
    render();
    toast("Login successful");
    // Cloud sync is attempted after login; a sync failure must not log the user out.
    if(sb) syncPull().catch(e=>console.warn("Post-login sync:",e));
    return;
  }

  // 2) Cloud/Supabase Auth login. The field must be the Auth email.
  if(sb){
    if(!u.includes("@")){
      warn.textContent="⚠️ Cloud loginக்கு Username அல்ல, Supabase Auth Email பயன்படுத்தவும். உதா: admin@example.com";
      warn.classList.remove("hidden");
      document.getElementById("password").value="";
      return;
    }
    try{
      const {data,error}=await sb.auth.signInWithPassword({email:u,password:p});
    if(!error){ cloudAuthEmail=u; cloudAuthPassword=p; }
      if(error) throw error;
      const au=data?.user;
      if(!au) throw new Error("Login session கிடைக்கவில்லை. மீண்டும் முயற்சி செய்யவும்.");

      let profile=null;
      try{
        profile=await loadCloudProfile(au);
      }catch(profileErr){
        console.warn("Profile load:",profileErr);
        profile={id:au.id,name:au.user_metadata?.full_name||au.email?.split("@")[0]||"User",
          username:au.email,email:au.email,category:"Admin",role:"owner",auth_user_id:au.id};
      }
      state.user=profile || {id:au.id,name:au.email?.split("@")[0]||"User",username:au.email,email:au.email,category:"Cashier",auth_user_id:au.id};
      sessionStorage.setItem("smf_session",JSON.stringify(state.user));
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      history.replaceState({smf:true,view:"dashboard"},"","#app-dashboard");
      state.view="dashboard";
      render();
      await syncPull();
      toast("Cloud login successful");
      return;
    }catch(error){
      console.warn("Cloud login failed:",error);
      warn.textContent="⚠️ Login failed: "+(error?.message||"Username / Password சரிபார்க்கவும்.");
      warn.classList.remove("hidden");
      document.getElementById("password").value="";
      document.getElementById("password").focus();
      try{ await sb.auth.signOut(); }catch(e){}
      return;
    }
  }

  warn.textContent="⚠️ Username அல்லது Password தவறு. சரியாக உள்ளிட்டு மீண்டும் முயற்சி செய்யவும்.";
  warn.classList.remove("hidden");
  document.getElementById("password").value="";
  document.getElementById("password").focus();
}

window.addEventListener("popstate",(e)=>{
  if(!state.user) return;
  // Android back / edge-swipe: move to the previous app screen.
  if(e.state?.smf && e.state.view){
    state.view=e.state.view;
    closeMenu();
    render();
    window.scrollTo(0,0);
    return;
  }
  // Do not let the browser/app close while logged in.
  state.view="dashboard";
  history.replaceState({smf:true,view:"dashboard"},"","#app-dashboard");
  render();
  toast("Back: Dashboard");
});

    state.view="dashboard";
    history.replaceState({smf:true,view:"dashboard"},"","#app-dashboard");

    syncPull();

});

async function saveUser(e){
 e.preventDefault(); if(!isAdmin())return toast("Admin only");
 const f=new FormData(e.target),name=String(f.get("name")||"").trim(),email=String(f.get("email")||"").trim().toLowerCase(),password=String(f.get("password")||""),category=String(f.get("category")||"Cashier");
 if(!sb)return toast("☁️ Cloud login required to create users");
 if(password.length<6)return toast("Password minimum 6 characters");
 const orgId=cloudProfile?.organization_id; if(!orgId)return toast("Organization profile missing. Please login again.");
 try{
   const {data:sessionData}=await sb.auth.getSession();
   const accessToken=sessionData?.session?.access_token;
   if(!accessToken)throw new Error("Login session expired. Please login again.");
   const res=await fetch(`${SUPABASE_URL}/functions/v1/admin-create-user`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${accessToken}`},body:JSON.stringify({name,email,password,role:category.toLowerCase()})});
   const result=await res.json().catch(()=>({}));
   if(!res.ok)throw new Error(result.error||"User creation failed");
   const row=result.user;
   state.data.users=state.data.users.filter(x=>x.id!==row.id);state.data.users.push(row);
   saveLocal(); await syncPush("users",row);
   toast("✅ User created successfully."); e.target.reset(); render();
 }catch(err){toast("❌ User create failed: "+(err.message||err))}
}

function waitForSanctionImages(root){
  const imgs=[...root.querySelectorAll("img")];
  return Promise.all(imgs.map(img=>{
    if(img.complete)return Promise.resolve();
    return new Promise(resolve=>{
      img.onload=resolve; img.onerror=resolve;
    });
  }));
}

async function downloadSanctionPDF(){
  const p=state.data.parties.find(x=>x.id===document.getElementById("sanParty")?.value)||state.data.parties[0];
  if(!p)return toast("⚠️ முதலில் Party add செய்யவும்");
  const l=partyLoans(p.id).slice(-1)[0];
  if(!l)return toast("⚠️ இந்த Party-க்கு Loan இல்லை");

  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(e){}

  const root=document.createElement("div");
  root.id="printSanctionRoot";
  root.style.cssText="position:fixed;left:-30000px;top:0;width:210mm;background:#fff;overflow:hidden";
  root.innerHTML=sanctionA4HTML(p,l);
  document.body.appendChild(root);

  try{
    await waitForSanctionImages(root);
    const pages=[...root.querySelectorAll(".sanction-a4-preview")];
    const canvases=[];
    for(const page of pages){
      canvases.push(await html2canvas(page,{
        scale:2.5,useCORS:true,allowTaint:false,backgroundColor:"#ffffff",
        logging:false,windowWidth:794,imageTimeout:30000
      }));
    }

    const {jsPDF}=window.jspdf;
    const d=new jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
    canvases.forEach((canvas,i)=>{
      if(i)d.addPage("a4","portrait");
      d.addImage(canvas.toDataURL("image/jpeg",0.96),"JPEG",0,0,210,297,undefined,"FAST");
    });
    d.save(`loan-sanction-${p.name}.pdf`);
    toast("✅ 2-Page A4 Portrait Sanction PDF Saved");
  }catch(e){
    console.error("Sanction PDF error:",e);
    toast("❌ PDF உருவாக்க முடியவில்லை");
  }finally{root.remove()}
}

function downloadStatementPDF(){
 try{
   const payments=[...(state.data.payments||[])].map(x=>{
     const party=state.data.parties.find(p=>p.id===x.partyId);
     return {date:String(x.date||"-"),party:String(party?.name||"-"),amount:money(x.amount),type:String(x.type||"Cash")};
   }).sort((a,b)=>b.date.localeCompare(a.date));

   // Dependency-free PDF generator. This avoids jsPDF/CDN download errors on Android/WebView.
   const esc=s=>String(s??"").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)").replace(/[^\x20-\x7E]/g,"?");
   const pageW=595,pageH=842, margin=36;
   const pages=[]; let lines=[]; let y=800;
   const addText=(text,x,yy,size=9,bold=false)=>{ lines.push(`BT /${bold?"F2":"F1"} ${size} Tf ${x} ${yy} Td (${esc(text)}) Tj ET`); };
   const addLine=(x1,y1,x2,y2)=>lines.push(`${x1} ${y1} m ${x2} ${y2} l S`);
   const header=()=>{
     lines=[]; y=800;
     addText("SENTHOOR MURUGAN FINANCE",margin,y,15,true); y-=18;
     addText("Pollachi Main Road, Taluka Office Opposite, Palladam - 641 664",margin,y,7); y-=18;
     addText("STATEMENT",pageW/2-35,y,12,true); y-=18;
     addLine(margin,y,pageW-margin,y); y-=18;
     addText("Date",margin,y,8,true); addText("Party",125,y,8,true); addText("Amount",395,y,8,true); addText("Type",485,y,8,true); y-=7;
     addLine(margin,y,pageW-margin,y); y-=15;
   };
   header();
   if(!payments.length){ addText("No payments found.",margin,y,9); pages.push(lines); }
   else payments.forEach(r=>{
     if(y<55){ pages.push(lines); header(); }
     addText(r.date,margin,y,8); addText(r.party.slice(0,42),125,y,8); addText(r.amount,395,y,8); addText(r.type,485,y,8); y-=17;
   });
   if(pages.length===0 || pages[pages.length-1]!==lines) pages.push(lines);

   const objects=[]; const addObj=o=>{objects.push(o);return objects.length;};
   const catalog=addObj("<< /Type /Catalog /Pages 2 0 R >>");
   const pageKids=[]; let font1,font2;
   // reserve pages root at object 2
   pages.forEach(()=>pageKids.push(0));
   font1=addObj("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
   font2=addObj("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>");
   const pageObjIds=[];
   pages.forEach(cmds=>{
     const stream=cmds.join("\n");
     const contentId=addObj(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
     const pageId=addObj(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 ${font1} 0 R /F2 ${font2} 0 R >> >> /Contents ${contentId} 0 R >>`);
     pageObjIds.push(pageId);
   });
   objects[1]=`<< /Type /Pages /Kids [${pageObjIds.map(id=>id+" 0 R").join(" ")}] /Count ${pageObjIds.length} >>`;
   let pdf="%PDF-1.4\n%âãÏÓ\n", offsets=[0];
   objects.forEach((obj,i)=>{offsets[i+1]=pdf.length;pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;});
   const xref=pdf.length; pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;
   for(let i=1;i<=objects.length;i++) pdf+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
   pdf+=`trailer\n<< /Size ${objects.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
   const blob=new Blob([pdf],{type:"application/pdf"});
   const url=URL.createObjectURL(blob); const a=document.createElement("a");
   a.href=url; a.download=`senthoor-murugan-statement-${today()}.pdf`; a.style.display="none";
   document.body.appendChild(a); a.click(); setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1500);
   toast("✅ Statement PDF Downloaded Successfully");
 }catch(e){ console.error("Statement PDF error:",e); toast("❌ Statement PDF download failed: "+(e.message||"Unknown error")); }
}

/* ---------- Supabase Cloud V3: multi-user + multi-device ---------- */
const CLOUD_TABLES=["settings","users","parties","loans","payments"];
let cloudReady=false,cloudProfile=null,cloudOrganization=null,cloudBranch=null;
let cloudAuthEmail="",cloudAuthPassword="";
async function cloudAuthUser(){if(!sb)return null;const {data:{user}}=await sb.auth.getUser();return user||null}
async function loadCloudProfile(au=null){
 if(!sb)return null; au=au||await cloudAuthUser();if(!au)return null;
 const {data,error}=await sb.from("profiles").select("id,full_name,email,role,organization_id,branch_id,active").eq("id",au.id).maybeSingle();
 if(error)throw error;
 if(!data){cloudProfile={id:au.id,name:au.user_metadata?.full_name||au.email?.split("@")[0]||"User",username:au.email,email:au.email,category:"Cashier",role:"cashier",auth_user_id:au.id};return cloudProfile}
 if(data.active===false)throw new Error("Your account is disabled by the administrator.");
 const role=String(data.role||"cashier").toLowerCase(),category=role==="owner"||role==="admin"?"Admin":role==="manager"?"Manager":role==="accounts"?"Accounts":"Cashier";
 cloudProfile={id:data.id,name:data.full_name||au.email?.split("@")[0]||"User",username:au.email,email:data.email||au.email,category,role,auth_user_id:au.id,organization_id:data.organization_id,branch_id:data.branch_id};
 if(data.organization_id){const {data:org}=await sb.from("organizations").select("id,name,phone,address").eq("id",data.organization_id).maybeSingle();cloudOrganization=org||null}
 if(data.branch_id){const {data:br}=await sb.from("branches").select("id,name,address").eq("id",data.branch_id).maybeSingle();cloudBranch=br||null}
 return cloudProfile
}
function cloudOrgId(){return cloudProfile?.organization_id||null}
async function syncPull(){
 if(!sb)return; try{const au=await cloudAuthUser();if(!au){state.online=false;return}await loadCloudProfile(au);const orgId=cloudOrgId();if(!orgId){state.online=false;console.warn("Cloud profile has no organization_id");return}
  for(const t of CLOUD_TABLES){const {data,error}=await sb.from("finance_data").select("id,data,updated_at,organization_id").eq("table_name",t).eq("organization_id",orgId).order("updated_at",{ascending:true});if(error)throw error;if(t==="settings"&&data?.[0])state.data.settings=data[0].data||state.data.settings;if(t!=="settings")state.data[t]=(data||[]).map(x=>x.data).filter(Boolean)}
  saveLocal();state.online=true;cloudReady=true;render();subscribeRealtime();
 }catch(e){state.online=false;console.warn("Cloud sync:",e.message)}}
async function syncPush(table,changedRow=null){
 if(!sb)return false;try{const au=await cloudAuthUser(),orgId=cloudOrgId();if(!au||!orgId)return false;
  if(table==="settings"){const {error}=await sb.from("finance_data").upsert({id:`${orgId}_settings_main`,table_name:"settings",organization_id:orgId,data:state.data.settings,updated_by:au.id,updated_at:new Date().toISOString()},{onConflict:"id"});if(error)throw error;return true}
  if(changedRow){
    const row={...changedRow}; delete row.password; delete row.organization_id;
    const payload={id:String(changedRow.id),table_name:table,organization_id:orgId,data:{...row,organization_id:orgId},updated_by:au.id,updated_at:new Date().toISOString()};
    const {error}=await sb.from("finance_data").upsert(payload,{onConflict:"id"});if(error)throw error;return true;
  }
  const arr=Array.isArray(state.data[table])?state.data[table]:[];
  const payload=arr.map(row=>{const clean={...row};delete clean.password;delete clean.organization_id;return {id:String(row.id),table_name:table,organization_id:orgId,data:{...clean,organization_id:orgId},updated_by:au.id,updated_at:new Date().toISOString()}});
  if(payload.length){const {error}=await sb.from("finance_data").upsert(payload,{onConflict:"id"});if(error)throw error}
  return true
 }catch(e){console.warn("Cloud push:",e.message);return false}}
async function syncPushAll(){for(const t of CLOUD_TABLES)await syncPush(t)}
function subscribeRealtime(){if(!sb||window._rt)return;window._rt=true;sb.channel("smf-cloud-v3").on("postgres_changes",{event:"*",schema:"public",table:"finance_data"},()=>{clearTimeout(window._syncTimer);window._syncTimer=setTimeout(syncPull,250)}).subscribe()}
async function initCloudAuth(){if(!sb)return;try{const {data:{session}}=await sb.auth.getSession();if(session){state.online=true;await syncPull()}sb.auth.onAuthStateChange(async(event,session)=>{if(session){state.online=true;await syncPull()}else{state.online=false;cloudProfile=null;cloudOrganization=null;cloudBranch=null}})}catch(e){console.warn("Auth init:",e.message)}}
